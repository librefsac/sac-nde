@if (links().length) {
  <section class="external-search" [attr.aria-label]="options.facetName">
    <h3 class="external-search__title">{{ options.facetName }}</h3>
    <ul class="external-search__list">
      @for (link of links(); track link.name) {
        <li>
          <a [href]="link.href" target="_blank" rel="noopener noreferrer">
            @if (link.img) {
              <img [src]="link.img" [alt]="link.alt ?? ''" height="20" />
            }
            <span>{{ link.name }}</span>
          </a>
        </li>
      }
    </ul>
  </section>
}
